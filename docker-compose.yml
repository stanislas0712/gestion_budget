services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: budget_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-budget}
      POSTGRES_USER: ${DB_USER:-budget}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-budget}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-budget}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budget_network
    restart: unless-stopped

  # Redis pour Celery et cache
  redis:
    image: redis:7-alpine
    container_name: budget_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budget_network
    restart: unless-stopped

  # Application Django (Web)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_web
    command: /docker-entrypoint.sh gunicorn
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budget_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker Celery pour les tâches asynchrones
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_celery_worker
    command: /docker-entrypoint.sh celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - budget_network
    restart: unless-stopped

  # Beat Celery pour les tâches périodiques
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_celery_beat
    command: /docker-entrypoint.sh celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - budget_network
    restart: unless-stopped



volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  budget_network:
    driver: bridge
